<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TKM China - Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4 max-w-xl mx-auto font-sans">
  <div class="bg-white p-6 rounded-2xl shadow-md border border-gray-200 mt-6">
    <h1 class="text-xl font-black text-gray-900 mb-4 border-b pb-2">TKM China - Admin Panel</h1>
    
    <form id="addProductForm" onsubmit="saveProduct(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Harydyň Ady</label>
        <input type="text" id="pTitle" required class="w-full p-3 border rounded-xl text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Bahasy (Örn: 85 TMT + Kargo)</label>
        <input type="text" id="pPrice" required class="w-full p-3 border rounded-xl text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Stok Sany (Örn: 5K Stokda)</label>
        <input type="text" id="pStock" required class="w-full p-3 border rounded-xl text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Yıldız (1-5)</label>
        <input type="number" id="pStars" min="1" max="5" value="5" required class="w-full p-3 border rounded-xl text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Aňlatması / Modellar</label>
        <textarea id="pDetails" required class="w-full p-3 border rounded-xl text-sm h-24"></textarea>
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Surat URL</label>
        <input type="url" id="pImage" required class="w-full p-3 border rounded-xl text-sm">
      </div>
      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3.5 rounded-xl text-sm shadow-md">Harydy Sayta Goş</button>
    </form>
  </div>

  <script>
    function saveProduct(e) {
      e.preventDefault();
      let products = JSON.parse(localStorage.getItem('tkmProducts')) || [];
      const newP = {
        id: Date.now(),
        title: document.getElementById('pTitle').value,
        price: document.getElementById('pPrice').value,
        stock: document.getElementById('pStock').value,
        stars: parseInt(document.getElementById('pStars').value),
        details: document.getElementById('pDetails').value,
        image: document.getElementById('pImage').value
      };
      products.unshift(newP);
      localStorage.setItem('tkmProducts', JSON.stringify(products));
      alert('Haryt üstünlikli goşuldy!');
      e.target.reset();
    }
  </script>
</body>
</html>
