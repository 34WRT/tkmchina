<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKM China - Hytaýdan Sargyt Etmek</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-top: 15px; color: #444; }
        input, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; background: #28a745; color: white; padding: 14px; border: none; border-radius: 8px; margin-top: 20px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:hover { background: #218838; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🇨🇳 TKM China 🇹🇲</h2>
    <p class="subtitle">Hytaýdan (Pinduoduo) islän harydyňyzy sargyt ediň</p>
    
    <form id="sargytForm">
        <label for="adynyz">Adyňyz we Familiýaňyz:</label>
        <input type="text" id="adynyz" placeholder="Meselem: Serdar Amanow" required>

        <label for="telefon">Telefon Belgiňiz (+993):</label>
        <input type="tel" id="telefon" placeholder="+99365123456" value="+993" required>

        <label for="harytLink">Harydyň Linki (Pinduoduo / Taobao):</label>
        <input type="url" id="harytLink" placeholder="https://..." required>

        <label for="bellik">Bellik (Ölçegi, reňki lale...):</label>
        <textarea id="bellik" rows="3" placeholder="Meselem: Gara reňk, XL ölçeg"></textarea>

        <button type="submit">Sargyt Etmek</button>
    </form>

    <div id="status"></div>
</div>

<script>
    document.getElementById('sargytForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusDiv = document.getElementById('status');
        statusDiv.style.color = 'blue';
        statusDiv.innerText = 'Sargyt ugradylýar...';

        const data = {
            adynyz: document.getElementById('adynyz').value,
            telefon: document.getElementById('telefon').value,
            harytLink: document.getElementById('harytLink').value,
            bellik: document.getElementById('bellik').value
        };

        try {
            const res = await fetch('/api/sargyt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const result = await res.json();

            if (result.success) {
                statusDiv.style.color = 'green';
                statusDiv.innerText = result.message;
                document.getElementById('sargytForm').reset();
                document.getElementById('telefon').value = '+993';
            } else {
                statusDiv.style.color = 'red';
                statusDiv.innerText = result.message;
            }
        } catch (err) {
            statusDiv.style.color = 'red';
            statusDiv.innerText = 'Säwlik çykdy, täzeden synanyşyň.';
        }
    });
</script>

</body>
</html>
