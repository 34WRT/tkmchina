<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TKM China - Sargyt Platformasy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .pb-safe { padding-bottom: calc(4.5rem + env(safe-area-inset-bottom)); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-gray-100 font-sans antialiased text-gray-800 pb-safe">

  <!-- 1. REGISTRASIÝA / GIRİŞ EKRANI -->
  <div id="authScreen" class="fixed inset-0 z-50 bg-gray-900 bg-opacity-70 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-6 text-center">
      <div class="w-16 h-16 bg-red-100 rounded-2xl flex items-center justify-center mx-auto mb-4 text-red-600 text-2xl shadow-inner">
        <i class="fa-solid fa-bag-shopping"></i>
      </div>
      <h2 class="text-2xl font-black text-gray-900 mb-1">TKM China</h2>
      <p class="text-gray-500 text-xs mb-6">Sargyt etmek üçin ilki bilen ulgama girilmelidir</p>

      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Adyňyz we Familiýaňyz</label>
          <input type="text" id="regName" placeholder="Meselem: Selim Berdiyew" required
            class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none text-sm transition">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Telefon belgiňiz</label>
          <div class="flex">
            <span class="inline-flex items-center px-4 rounded-l-xl border border-r-0 border-gray-300 bg-gray-100 text-gray-700 font-bold text-sm">+993</span>
            <input type="tel" id="regPhone" placeholder="65123456" required maxlength="8"
              class="w-full px-4 py-3 border border-gray-300 rounded-r-xl focus:ring-2 focus:ring-red-500 focus:border-red-500 outline-none text-sm font-semibold transition">
          </div>
          <p class="text-[10px] text-gray-400 mt-1">Diňe 61, 62, 63, 64, 65, 71, 72 bilen başlaşýan belgiler kabul edilýär.</p>
        </div>
        <button type="submit"
          class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-red-500/30 transition transform active:scale-95 text-sm mt-2">
          Registrasiýa bol
        </button>
      </form>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="mainApp" class="hidden min-h-screen">

    <!-- SEARCH HEADER (Sadece Home Sekmesinde Görünür) -->
    <header id="searchHeader" class="sticky top-0 z-40 bg-white border-b border-gray-200 px-4 py-3 shadow-sm">
      <div class="relative flex items-center">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-gray-400 text-sm"></i>
        <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Harytlary gözleň..."
          class="w-full bg-gray-100 text-sm rounded-full pl-10 pr-10 py-2.5 outline-none focus:ring-2 focus:ring-red-500 transition">
        <i class="fa-solid fa-camera absolute right-3.5 text-gray-400 text-sm"></i>
      </div>
      <div class="flex space-x-6 overflow-x-auto mt-3 text-xs font-bold text-gray-600 no-scrollbar pb-1">
        <span class="text-red-600 border-b-2 border-red-600 pb-1 whitespace-nowrap">Ählisi</span>
        <span class="whitespace-nowrap hover:text-red-600">Telefonlar</span>
        <span class="whitespace-nowrap hover:text-red-600">Eşikler</span>
        <span class="whitespace-nowrap hover:text-red-600">Aksessuarlar</span>
      </div>
    </header>

    <!-- SAYFA 1: BAŞ SAHYPA (ÜRÜN LİSTESİ) -->
    <main id="homeTab" class="p-3">
      <div id="productGrid" class="grid grid-cols-2 gap-3"></div>
    </main>

    <!-- SAYFA 2: SARGYTLARYM -->
    <main id="ordersTab" class="p-4 hidden">
      <h1 class="text-xl font-bold text-gray-900 mb-4">Meniň Sargytlarym</h1>
      <div id="ordersList" class="space-y-3"></div>
    </main>

    <!-- SAYFA 3: SAHYPAM (ESKİ HESABYM) -->
    <main id="profileTab" class="p-4 hidden">
      <div class="bg-white rounded-2xl p-5 shadow-sm border border-gray-100 mb-4 flex items-center space-x-4">
        <div class="w-14 h-14 bg-red-600 rounded-full flex items-center justify-center text-white text-xl font-bold" id="profileAvatar">U</div>
        <div>
          <h2 class="text-lg font-bold text-gray-900" id="profileName">--</h2>
          <p class="text-sm font-semibold text-gray-500" id="profilePhone">+993 -- ------</p>
        </div>
      </div>
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <button onclick="logout()" class="w-full px-4 py-3.5 flex items-center justify-between text-left text-red-600 hover:bg-gray-50 font-bold text-sm">
          <span><i class="fa-solid fa-right-from-bracket mr-2"></i> Ulgamdan çykmak</span>
          <i class="fa-solid fa-chevron-right text-gray-400 text-xs"></i>
        </button>
      </div>
    </main>

    <!-- DETAY MODAL (PINDUODUO TARZI DETAY SAYFASI) -->
    <div id="productModal" class="fixed inset-0 z-50 bg-gray-900 bg-opacity-70 hidden flex flex-col justify-end">
      <div class="bg-white w-full rounded-t-3xl max-h-[90vh] overflow-y-auto p-5 relative animate-slide-up">
        <button onclick="closeModal()" class="absolute top-4 right-4 bg-gray-100 w-8 h-8 rounded-full flex items-center justify-center text-gray-600 font-bold">✕</button>
        
        <img id="modalImage" class="w-full h-64 object-contain rounded-2xl mb-4 bg-gray-50">
        <div class="flex items-center space-x-1 text-yellow-400 mb-2" id="modalStars"></div>
        <h2 id="modalTitle" class="text-lg font-extrabold text-gray-900 mb-2"></h2>
        <p id="modalDetails" class="text-xs text-gray-500 mb-4 leading-relaxed bg-gray-50 p-3 rounded-xl border border-gray-100"></p>
        
        <div class="flex items-center justify-between mb-6">
          <div>
            <span class="text-xs text-gray-400 block">Bahasy:</span>
            <span id="modalPrice" class="text-xl font-black text-red-600"></span>
          </div>
          <span id="modalStock" class="bg-red-50 text-red-600 text-xs font-bold px-3 py-1 rounded-full"></span>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2 border-t border-gray-100">
          <button onclick="addToCart()" class="bg-yellow-500 hover:bg-yellow-600 text-white font-bold py-3.5 rounded-xl text-xs shadow-md">Sebede Goş</button>
          <button id="modalOrderBtn" onclick="confirmOrder()" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3.5 rounded-xl text-xs shadow-md shadow-red-500/30"></button>
        </div>
      </div>
    </div>

    <!-- BOTTOM NAV BAR -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around py-2.5 z-40 shadow-lg">
      <button onclick="switchTab('home')" id="navHome" class="flex flex-col items-center text-red-600">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] font-bold mt-0.5">Baş Sahypa</span>
      </button>
      <button onclick="switchTab('orders')" id="navOrders" class="flex flex-col items-center text-gray-400">
        <i class="fa-solid fa-box text-lg"></i>
        <span class="text-[10px] font-bold mt-0.5">Sargytlarym</span>
      </button>
      <button onclick="switchTab('profile')" id="navProfile" class="flex flex-col items-center text-gray-400">
        <i class="fa-solid fa-user text-lg"></i>
        <span class="text-[10px] font-bold mt-0.5">Sahypam</span>
      </button>
    </nav>

  </div>

  <script>
    // VARSAYILAN ÜRÜNLER (GÖNDERİLEN GÖRSELLERİ İLE)
    let defaultProducts = [
      {
        id: 1,
        title: 'INS Gün Şöhlesi üçin Açki / AK-GÖK Renkde',
        price: '60 TMT + Kargo',
        stock: 'Stok: 24K',
        stars: 5,
        details: 'INS stildäki gün şöhlesinden goraýjy gözlük. Ak-gök açyk reňkli dizaýn, ýokary hilli kachestwo.',
        image: 'https://i.ibb.co/68v8y1W/glasses.jpg' 
      },
      {
        id: 2,
        title: 'iPhonelar Üçin Yumşak Cehol + Kacestvaly / Islendik Renk',
        price: '90 TMT + Kargo',
        stock: '20K Stokda',
        stars: 5,
        details: 'iPhone 13, 14, 15, 16, 17 + Pro + ProMax modelleri üçin yumşak we taze dizaýnly Cehollar. UniSex peýdalanmak üçin.',
        image: 'https://i.ibb.co/3kWkC9s/case.jpg'
      },
      {
        id: 3,
        title: 'Kart Salynyan MagSafe KARTLYK / Islendik Renk',
        price: '85 TMT + Kargo',
        stock: '5K Stokda',
        stars: 5,
        details: 'iPhone 12, 13, 16, 17 Pro + ProMax modelleri üçin magseýf deri kartlyk. Güçli magnitli.',
        image: 'https://i.ibb.co/VMyLdTh/magsafe.jpg'
      }
    ];

    let products = JSON.parse(localStorage.getItem('tkmProducts')) || defaultProducts;
    let user = JSON.parse(localStorage.getItem('tkmUser')) || null;
    let myOrders = JSON.parse(localStorage.getItem('tkmOrders')) || [];
    let activeProduct = null;

    document.addEventListener("DOMContentLoaded", () => {
      if (user) showApp();
      renderProducts(products);
    });

    // TELEFON NUMARASI DOĞRULAMA (+993 61..72)
    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const phoneInput = document.getElementById('regPhone').value.trim();
      
      const validPrefixes = ['61', '62', '63', '64', '65', '71', '72'];
      const prefix = phoneInput.substring(0, 2);

      if (phoneInput.length !== 8 || !validPrefixes.includes(prefix)) {
        alert("Ryskyňyzy barlang! Telefon belgi diňe +993 61, 62, 63, 64, 65, 71, 72 bilen başlamaly we 8 sandan ybarat bolmaly!");
        return;
      }

      user = { name, phone: '+993' + phoneInput };
      localStorage.setItem('tkmUser', JSON.stringify(user));
      showApp();
    }

    function showApp() {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      document.getElementById('profileName').innerText = user.name;
      document.getElementById('profilePhone').innerText = user.phone;
      document.getElementById('profileAvatar').innerText = user.name.charAt(0).toUpperCase();
    }

    function renderProducts(items) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = items.map(p => `
        <div onclick="openModal(${p.id})" class="bg-white rounded-2xl overflow-hidden shadow-sm border border-gray-100 flex flex-col justify-between cursor-pointer active:scale-98 transition">
          <div>
            <img src="${p.image}" class="w-full h-40 object-cover bg-gray-50" onerror="this.src='https://via.placeholder.com/200'">
            <div class="p-2.5">
              <div class="flex items-center text-yellow-400 text-[10px] mb-1">
                ${'<i class="fa-solid fa-star"></i>'.repeat(p.stars || 5)}
              </div>
              <h3 class="text-xs font-bold text-gray-800 line-clamp-2 leading-tight">${p.title}</h3>
            </div>
          </div>
          <div class="p-2.5 pt-0">
            <span class="text-red-600 font-black text-sm block">${p.price}</span>
          </div>
        </div>
      `).join('');
    }

    function openModal(id) {
      activeProduct = products.find(p => p.id === id);
      if(!activeProduct) return;

      document.getElementById('modalImage').src = activeProduct.image;
      document.getElementById('modalTitle').innerText = activeProduct.title;
      document.getElementById('modalDetails').innerText = activeProduct.details;
      document.getElementById('modalPrice').innerText = activeProduct.price;
      document.getElementById('modalStock').innerText = activeProduct.stock;
      document.getElementById('modalStars').innerHTML = '<i class="fa-solid fa-star"></i>'.repeat(activeProduct.stars || 5);
      document.getElementById('modalOrderBtn').innerText = `Sargyt Et - ${activeProduct.price}`;

      document.getElementById('productModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('productModal').classList.add('hidden');
    }

    async function confirmOrder() {
      if (!activeProduct) return;
      const orderData = { user: user.name, phone: user.phone, product: activeProduct.title, price: activeProduct.price, date: new Date().toLocaleDateString() };
      
      myOrders.push(orderData);
      localStorage.setItem('tkmOrders', JSON.stringify(myOrders));

      await fetch('/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderData)
      });

      alert('Sargydyňyz üstünlikli kabul edildi!');
      closeModal();
      switchTab('orders');
    }

    function addToCart() {
      alert('Haryt sebede goşuldy!');
      closeModal();
    }

    function filterProducts() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      renderProducts(products.filter(p => p.title.toLowerCase().includes(q)));
    }

    function switchTab(tab) {
      document.getElementById('homeTab').classList.add('hidden');
      document.getElementById('ordersTab').classList.add('hidden');
      document.getElementById('profileTab').classList.add('hidden');
      document.getElementById('searchHeader').classList.add('hidden');

      document.getElementById('navHome').className = "flex flex-col items-center text-gray-400";
      document.getElementById('navOrders').className = "flex flex-col items-center text-gray-400";
      document.getElementById('navProfile').className = "flex flex-col items-center text-gray-400";

      if(tab === 'home') {
        document.getElementById('homeTab').classList.remove('hidden');
        document.getElementById('searchHeader').classList.remove('hidden');
        document.getElementById('navHome').className = "flex flex-col items-center text-red-600";
      } else if(tab === 'orders') {
        document.getElementById('ordersTab').classList.remove('hidden');
        document.getElementById('navOrders').className = "flex flex-col items-center text-red-600";
        renderOrders();
      } else if(tab === 'profile') {
        document.getElementById('profileTab').classList.remove('hidden');
        document.getElementById('navProfile').className = "flex flex-col items-center text-red-600";
      }
    }

    function renderOrders() {
      const list = document.getElementById('ordersList');
      if (myOrders.length === 0) {
        list.innerHTML = '<p class="text-gray-500 text-center py-8 text-sm">Heniz sargyt etmediňiz.</p>';
        return;
      }
      list.innerHTML = myOrders.map(o => `
        <div class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex justify-between items-center">
          <div>
            <h4 class="font-bold text-sm text-gray-900">${o.product}</h4>
            <span class="text-xs font-black text-red-600 block mt-0.5">${o.price}</span>
            <p class="text-[10px] text-gray-400 mt-1">${o.date}</p>
          </div>
          <span class="bg-green-100 text-green-700 text-xs font-bold px-3 py-1 rounded-full">Kabul edildi</span>
        </div>
      `).join('');
    }

    function logout() {
      localStorage.removeItem('tkmUser');
      location.reload();
    }
  </script>
</body>
</html>
