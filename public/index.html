<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TKM China - Sargyt Platformasy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* REAL LIQUID GLASS BACKGROUND & THEME */
    body { 
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%) fixed !important;
      -webkit-tap-highlight-color: transparent; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f8fafc;
    }
    .pb-safe { padding-bottom: calc(5.5rem + env(safe-area-inset-bottom)); }

    /* ULTRA LIQUID GLASS EFFECT */
    .liquid-card {
      background: rgba(255, 255, 255, 0.12) !important;
      backdrop-filter: blur(20px) saturate(190%) !important;
      -webkit-backdrop-filter: blur(20px) saturate(190%) !important;
      border: 1px solid rgba(255, 255, 255, 0.22) !important;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .liquid-header {
      background: rgba(15, 23, 42, 0.65) !important;
      backdrop-filter: blur(25px) saturate(200%) !important;
      -webkit-backdrop-filter: blur(25px) saturate(200%) !important;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15) !important;
    }

    .liquid-nav {
      background: rgba(15, 23, 42, 0.75) !important;
      backdrop-filter: blur(25px) saturate(200%) !important;
      -webkit-backdrop-filter: blur(25px) saturate(200%) !important;
      border-top: 1px solid rgba(255, 255, 255, 0.15) !important;
    }

    .liquid-btn-red {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.9), rgba(185, 28, 28, 1)) !important;
      box-shadow: 0 8px 25px rgba(220, 38, 38, 0.5) !important;
      border: 1px solid rgba(255, 255, 255, 0.4) !important;
    }

    .liquid-btn-amber {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.9), rgba(180, 83, 9, 1)) !important;
      box-shadow: 0 8px 25px rgba(217, 119, 6, 0.5) !important;
      border: 1px solid rgba(255, 255, 255, 0.4) !important;
    }
  </style>
</head>
<body class="antialiased pb-safe min-h-screen">

  <!-- 1. REGISTRASIÝA EKRANI -->
  <div id="authScreen" class="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-2xl flex items-center justify-center p-4">
    <div class="liquid-card w-full max-w-md rounded-3xl p-6 text-center">
      <div class="w-16 h-16 bg-red-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4 text-red-400 text-2xl border border-red-500/30">
        <i class="fa-solid fa-bag-shopping"></i>
      </div>
      <h2 class="text-2xl font-black text-white mb-1">TKM China</h2>
      <p class="text-slate-300 text-xs mb-6">Sargyt etmek üçin ilki bilen ulgama girilmelidir</p>

      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 text-left">
        <div>
          <label class="block text-xs font-bold text-slate-200 mb-1">Adyňyz we Familiýaňyz</label>
          <input type="text" id="regName" placeholder="Meselem: Selim Berdiyew" required
            class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl focus:ring-2 focus:ring-red-500 outline-none text-sm text-white placeholder-slate-400 transition">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-200 mb-1">Telefon belgiňiz</label>
          <div class="flex">
            <span class="inline-flex items-center px-4 rounded-l-xl border border-r-0 border-white/20 bg-white/10 text-slate-200 font-bold text-sm">+993</span>
            <input type="tel" id="regPhone" placeholder="65123456" required maxlength="8"
              class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-r-xl focus:ring-2 focus:ring-red-500 outline-none text-sm font-semibold text-white placeholder-slate-400 transition">
          </div>
        </div>
        <button type="submit"
          class="w-full liquid-btn-red text-white font-bold py-3.5 rounded-xl transition transform active:scale-95 text-sm mt-2">
          Registrasiýa bol
        </button>
      </form>
    </div>
  </div>

  <!-- UYGULAMA KAPSAYICI -->
  <div id="mainApp" class="hidden min-h-screen">

    <!-- TEMİZ ARAMA BAR -->
    <header id="searchHeader" class="sticky top-0 z-40 liquid-header px-4 py-3">
      <div class="relative flex items-center">
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 text-slate-400 text-sm"></i>
        <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Harytlary gözleň..."
          class="w-full bg-white/10 text-sm rounded-full pl-10 pr-10 py-2.5 outline-none focus:ring-2 focus:ring-red-500 border border-white/20 text-white placeholder-slate-400 transition">
        
        <input type="file" id="imageSearchInput" accept="image/*" class="hidden" onchange="handleImageSearch(event)">
        <button onclick="document.getElementById('imageSearchInput').click()" class="absolute right-3.5 text-slate-400 hover:text-red-400 transition">
          <i class="fa-solid fa-camera text-base"></i>
        </button>
      </div>
    </header>

    <!-- SAYFA 1: BAŞ SAHYPA -->
    <main id="homeTab" class="p-3">
      <div id="productGrid" class="grid grid-cols-2 gap-3"></div>
    </main>

    <!-- SAYFA 2: SARGYTLARYM -->
    <main id="ordersTab" class="p-4 hidden">
      <h1 class="text-xl font-bold text-white mb-4">Meniň Sargytlarym</h1>
      <div id="ordersList" class="space-y-3"></div>
    </main>

    <!-- SAYFA 3: SAHYPAM -->
    <main id="profileTab" class="p-4 hidden">
      <div class="liquid-card rounded-2xl p-5 mb-4 flex items-center space-x-4">
        <div class="w-14 h-14 bg-red-600 rounded-full flex items-center justify-center text-white text-xl font-bold shadow-lg" id="profileAvatar">U</div>
        <div>
          <h2 class="text-lg font-bold text-white" id="profileName">--</h2>
          <p class="text-sm font-semibold text-slate-300" id="profilePhone">+993 -- ------</p>
        </div>
      </div>
      <div class="liquid-card rounded-2xl overflow-hidden">
        <button onclick="logout()" class="w-full px-4 py-3.5 flex items-center justify-between text-left text-red-400 hover:bg-white/10 font-bold text-sm">
          <span><i class="fa-solid fa-right-from-bracket mr-2"></i> Ulgamdan çykmak</span>
          <i class="fa-solid fa-chevron-right text-slate-400 text-xs"></i>
        </button>
      </div>
    </main>

    <!-- ÜRÜN DETAY MODAL -->
    <div id="productModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-2xl hidden flex flex-col justify-end">
      <div class="liquid-card w-full rounded-t-3xl max-h-[85vh] overflow-y-auto p-5 relative border-t border-white/30">
        <button onclick="closeModal()" class="absolute top-4 right-4 bg-white/20 w-8 h-8 rounded-full flex items-center justify-center text-white font-bold">✕</button>
        
        <img id="modalImage" class="w-full h-64 object-cover rounded-2xl mb-4 shadow-lg bg-slate-800 border border-white/10">
        <div class="flex items-center space-x-1 text-yellow-400 mb-2" id="modalStars"></div>
        <h2 id="modalTitle" class="text-lg font-extrabold text-white mb-2"></h2>
        <p id="modalDetails" class="text-xs text-slate-300 mb-4 leading-relaxed bg-white/5 p-3 rounded-xl border border-white/10"></p>
        
        <div class="flex items-center justify-between mb-6">
          <div>
            <span class="text-[10px] text-slate-400 block font-bold">Bahasy:</span>
            <span id="modalPrice" class="text-xl font-black text-red-400"></span>
          </div>
          <span id="modalStock" class="bg-red-500/20 text-red-300 border border-red-500/30 text-xs font-bold px-3 py-1 rounded-full"></span>
        </div>

        <div class="grid grid-cols-2 gap-3 pt-2 border-t border-white/10">
          <button onclick="addToCart()" class="liquid-btn-amber text-white font-bold py-3.5 rounded-xl text-xs transition">Sebede Goş</button>
          <button id="modalOrderBtn" onclick="confirmOrderDirect()" class="liquid-btn-red text-white font-bold py-3.5 rounded-xl text-xs transition"></button>
        </div>
      </div>
    </div>

    <!-- SEPET MODAL -->
    <div id="cartModal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-2xl hidden flex flex-col justify-end">
      <div class="liquid-card w-full rounded-t-3xl max-h-[80vh] overflow-y-auto p-5 relative border-t border-white/30">
        <div class="flex justify-between items-center mb-4 border-b pb-2 border-white/10">
          <h3 class="text-lg font-extrabold text-white"><i class="fa-solid fa-cart-shopping text-red-400 mr-2"></i> Meniň Sebedim</h3>
          <button onclick="closeCartModal()" class="bg-white/20 w-8 h-8 rounded-full flex items-center justify-center text-white font-bold">✕</button>
        </div>
        
        <div id="cartItemsList" class="space-y-3 mb-4"></div>

        <div class="border-t border-white/10 pt-4 mb-4 flex justify-between items-center">
          <span class="text-sm font-bold text-slate-200">Jemi Tutar:</span>
          <span id="cartTotalPrice" class="text-lg font-black text-red-400">0 TMT</span>
        </div>

        <button onclick="checkoutCart()" class="w-full liquid-btn-red text-white font-bold py-3.5 rounded-xl text-sm transition">Sargydy Tassykla</button>
      </div>
    </div>

    <!-- YÜZEN SEPET BUTONU -->
    <button id="floatingCartBtn" onclick="openCartModal()" class="hidden fixed bottom-20 right-4 z-40 liquid-btn-red text-white p-3.5 rounded-full flex items-center justify-center space-x-2 border-2 border-white/40 transform active:scale-90 transition">
      <i class="fa-solid fa-cart-shopping text-lg"></i>
      <span id="cartBadge" class="bg-white text-red-600 text-xs font-black px-2 py-0.5 rounded-full">0</span>
    </button>

    <!-- LIQUID GLASS BOTTOM NAV -->
    <nav class="fixed bottom-0 left-0 right-0 liquid-nav flex justify-around py-3 z-40">
      <button onclick="switchTab('home')" id="navHome" class="flex flex-col items-center text-red-400">
        <i class="fa-solid fa-house text-lg"></i>
        <span class="text-[10px] font-bold mt-0.5">Baş Sahypa</span>
      </button>
      <button onclick="switchTab('orders')" id="navOrders" class="flex flex-col items-center text-slate-400">
        <i class="fa-solid fa-box text-lg"></i>
        <span class="text-[10px] font-bold mt-0.5">Sargytlarym</span>
      </button>
      <button onclick="switchTab('profile')" id="navProfile" class="flex flex-col items-center text-slate-400">
        <i class="fa-solid fa-user text-lg"></i>
        <span class="text-[10px] font-bold mt-0.5">Sahypam</span>
      </button>
    </nav>

  </div>

  <script>
    let defaultProducts = [
      {
        id: 1,
        title: 'INS Gün Şöhlesi üçin Açki / AK-GÖK Renkde',
        priceNum: 60,
        priceStr: '60 TMT + Kargo',
        stock: 'Stok: 24K',
        stars: 5,
        details: 'INS stildäki gün şöhlesinden goraýjy gözlük. Ak-gök açyk reňkli dizaýn, ýokary hilli kachestwo.',
        image: 'https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500&auto=format&fit=crop'
      },
      {
        id: 2,
        title: 'iPhonelar Üçin Yumşak Cehol + Kacestvaly / Islendik Renk',
        priceNum: 90,
        priceStr: '90 TMT + Kargo',
        stock: '20K Stokda',
        stars: 5,
        details: 'iPhone 13, 14, 15, 16, 17 + Pro + ProMax modelleri üçin yumşak we taze dizaýnly Cehollar. UniSex peýdalanmak üçin.',
        image: 'https://images.unsplash.com/photo-1601784551446-20c9e07cdbdb?w=500&auto=format&fit=crop'
      },
      {
        id: 3,
        title: 'Kart Salynyan MagSafe KARTLYK / Islendik Renk',
        priceNum: 85,
        priceStr: '85 TMT + Kargo',
        stock: '5K Stokda',
        stars: 5,
        details: 'iPhone 12, 13, 16, 17 Pro + ProMax modelleri üçin magseýf deri kartlyk. Güçli magnitli.',
        image: 'https://images.unsplash.com/photo-1627123424574-724758594e93?w=500&auto=format&fit=crop'
      }
    ];

    let products = defaultProducts;
    let user = JSON.parse(localStorage.getItem('tkmUser')) || null;
    let myOrders = JSON.parse(localStorage.getItem('tkmOrders')) || [];
    let cart = [];
    let activeProduct = null;

    document.addEventListener("DOMContentLoaded", () => {
      if (user) showApp();
      renderProducts(products);
    });

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('regName').value.trim();
      const phoneInput = document.getElementById('regPhone').value.trim();
      
      const validPrefixes = ['61', '62', '63', '64', '65', '71', '72'];
      const prefix = phoneInput.substring(0, 2);

      if (phoneInput.length !== 8 || !validPrefixes.includes(prefix)) {
        alert("Yalňyş Telefon Belgi\nRegistrasiya Üçin\nDiňe 61-62-63-64-65 ve\n71-72 lik nomer giriziň!");
        return;
      }

      user = { name, phone: '+993' + phoneInput };
      localStorage.setItem('tkmUser', JSON.stringify(user));
      showApp();
    }

    function showApp() {
      document.getElementById('authScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      document.getElementById('profileName').innerText = user.name;
      document.getElementById('profilePhone').innerText = user.phone;
      document.getElementById('profileAvatar').innerText = user.name.charAt(0).toUpperCase();
    }

    function renderProducts(items) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = items.map(p => `
        <div onclick="openModal(${p.id})" class="liquid-card rounded-2xl overflow-hidden flex flex-col justify-between cursor-pointer active:scale-95 transition">
          <div>
            <img src="${p.image}" class="w-full h-40 object-cover bg-slate-800">
            <div class="p-2.5">
              <div class="flex items-center text-yellow-400 text-[10px] mb-1">
                ${'<i class="fa-solid fa-star"></i>'.repeat(p.stars || 5)}
              </div>
              <h3 class="text-xs font-bold text-white line-clamp-2 leading-tight">${p.title}</h3>
            </div>
          </div>
          <div class="p-2.5 pt-0">
            <span class="text-red-400 font-black text-sm block">${p.priceStr}</span>
          </div>
        </div>
      `).join('');
    }

    function handleImageSearch(e) {
      const file = e.target.files[0];
      if (file) {
        alert("Surat seljerilýär... Meňzeş harytlar tapyldy!");
        renderProducts(products);
      }
    }

    function openModal(id) {
      activeProduct = products.find(p => p.id === id);
      if(!activeProduct) return;

      document.getElementById('modalImage').src = activeProduct.image;
      document.getElementById('modalTitle').innerText = activeProduct.title;
      document.getElementById('modalDetails').innerText = activeProduct.details;
      document.getElementById('modalPrice').innerText = activeProduct.priceStr;
      document.getElementById('modalStock').innerText = activeProduct.stock;
      document.getElementById('modalStars').innerHTML = '<i class="fa-solid fa-star"></i>'.repeat(activeProduct.stars || 5);
      document.getElementById('modalOrderBtn').innerText = `Sargyt Et - ${activeProduct.priceStr}`;

      document.getElementById('productModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('productModal').classList.add('hidden');
    }

    function addToCart() {
      if(!activeProduct) return;
      const exist = cart.find(c => c.id === activeProduct.id);
      if(exist) {
        exist.qty += 1;
      } else {
        cart.push({ ...activeProduct, qty: 1 });
      }
      updateCartUI();
      closeModal();
    }

    function updateCartUI() {
      const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
      const floatBtn = document.getElementById('floatingCartBtn');
      const badge = document.getElementById('cartBadge');

      if(totalQty > 0) {
        floatBtn.classList.remove('hidden');
        badge.innerText = totalQty;
      } else {
        floatBtn.classList.add('hidden');
      }
    }

    function openCartModal() {
      const list = document.getElementById('cartItemsList');
      if(cart.length === 0) {
        list.innerHTML = '<p class="text-xs text-slate-400 text-center py-4">Sebediňiz boş.</p>';
      } else {
        list.innerHTML = cart.map(item => `
          <div class="flex items-center justify-between bg-white/10 p-3 rounded-xl border border-white/10">
            <div class="flex items-center space-x-3">
              <img src="${item.image}" class="w-12 h-12 rounded-lg object-cover">
              <div>
                <h4 class="text-xs font-bold text-white line-clamp-1">${item.title}</h4>
                <span class="text-xs text-red-400 font-black">${item.priceStr}</span>
              </div>
            </div>
            <div class="flex items-center space-x-2">
              <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-white/20 text-white rounded-full font-bold text-xs">-</button>
              <span class="text-xs font-bold text-white">${item.qty}</span>
              <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-white/20 text-white rounded-full font-bold text-xs">+</button>
            </div>
          </div>
        `).join('');
      }

      const total = cart.reduce((sum, item) => sum + (item.priceNum * item.qty), 0);
      document.getElementById('cartTotalPrice').innerText = `${total} TMT + Kargo`;
      document.getElementById('cartModal').classList.remove('hidden');
    }

    function changeQty(id, delta) {
      const item = cart.find(c => c.id === id);
      if(item) {
        item.qty += delta;
        if(item.qty <= 0) {
          cart = cart.filter(c => c.id !== id);
        }
      }
      updateCartUI();
      openCartModal();
    }

    function closeCartModal() {
      document.getElementById('cartModal').classList.add('hidden');
    }

    async function checkoutCart() {
      if(cart.length === 0) return;

      const orderSummary = cart.map(c => `${c.title} x${c.qty}`).join(', ');
      const totalPrice = cart.reduce((sum, item) => sum + (item.priceNum * item.qty), 0);

      const orderData = { 
        user: user.name, 
        phone: user.phone, 
        product: orderSummary, 
        price: `${totalPrice} TMT + Kargo`, 
        date: new Date().toLocaleDateString() 
      };

      myOrders.push(orderData);
      localStorage.setItem('tkmOrders', JSON.stringify(myOrders));

      await fetch('/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderData)
      });

      alert('Sargydyňyz üstünlikli kabul edildi!');
      cart = [];
      updateCartUI();
      closeCartModal();
      switchTab('orders');
    }

    async function confirmOrderDirect() {
      if (!activeProduct) return;
      const orderData = { 
        user: user.name, 
        phone: user.phone, 
        product: activeProduct.title, 
        price: activeProduct.priceStr, 
        date: new Date().toLocaleDateString() 
      };

      myOrders.push(orderData);
      localStorage.setItem('tkmOrders', JSON.stringify(myOrders));

      await fetch('/api/order', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(orderData)
      });

      alert('Sargydyňyz üstünlikli kabul edildi!');
      closeModal();
      switchTab('orders');
    }

    function filterProducts() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      renderProducts(products.filter(p => p.title.toLowerCase().includes(q)));
    }

    function switchTab(tab) {
      document.getElementById('homeTab').classList.add('hidden');
      document.getElementById('ordersTab').classList.add('hidden');
      document.getElementById('profileTab').classList.add('hidden');
      document.getElementById('searchHeader').classList.add('hidden');

      document.getElementById('navHome').className = "flex flex-col items-center text-slate-400";
      document.getElementById('navOrders').className = "flex flex-col items-center text-slate-400";
      document.getElementById('navProfile').className = "flex flex-col items-center text-slate-400";

      if(tab === 'home') {
        document.getElementById('homeTab').classList.remove('hidden');
        document.getElementById('searchHeader').classList.remove('hidden');
        document.getElementById('navHome').className = "flex flex-col items-center text-red-400";
      } else if(tab === 'orders') {
        document.getElementById('ordersTab').classList.remove('hidden');
        document.getElementById('navOrders').className = "flex flex-col items-center text-red-400";
        renderOrders();
      } else if(tab === 'profile') {
        document.getElementById('profileTab').classList.remove('hidden');
        document.getElementById('navProfile').className = "flex flex-col items-center text-red-400";
      }
    }

    function renderOrders() {
      const list = document.getElementById('ordersList');
      if (myOrders.length === 0) {
        list.innerHTML = '<p class="text-slate-400 text-center py-8 text-sm">Heniz sargyt etmediňiz.</p>';
        return;
      }
      list.innerHTML = myOrders.map(o => `
        <div class="liquid-card p-4 rounded-2xl flex justify-between items-center">
          <div>
            <h4 class="font-bold text-sm text-white">${o.product}</h4>
            <span class="text-xs font-black text-red-400 block mt-0.5">${o.price}</span>
            <p class="text-[10px] text-slate-400 mt-1">${o.date}</p>
          </div>
          <span class="bg-emerald-500/20 text-emerald-300 text-xs font-bold px-3 py-1 rounded-full border border-emerald-500/30">Kabul edildi</span>
        </div>
      `).join('');
    }

    function logout() {
      localStorage.removeItem('tkmUser');
      localStorage.removeItem('tkmOrders');
      location.reload();
    }
  </script>
</body>
</html>
